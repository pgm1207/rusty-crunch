name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: rusty-crunch
            artifact: rusty-crunch-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: rusty-crunch
            artifact: rusty-crunch-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: rusty-crunch
            artifact: rusty-crunch-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: rusty-crunch.exe
            artifact: rusty-crunch-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS -exec sha256sum {} \; \
            | awk '{ n=$2; sub(/.*\//, "", n); print $1 "  " n }' \
            | sort -k2 > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            SHA256SUMS
