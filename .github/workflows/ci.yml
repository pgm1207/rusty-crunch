name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all --locked

      - name: Release build
        run: cargo build --release --locked

      - name: End-to-end FFmpeg smoke test
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          INPUT_DIR="$RUNNER_TEMP/rusty-crunch-smoke"
          mkdir -p "$INPUT_DIR"
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi \
            -i "sine=frequency=1000:sample_rate=44100:duration=0.4" \
            -c:a pcm_s16le "$INPUT_DIR/sample.wav"
          target/release/rusty-crunch --yes --no-recursive --keep-originals \
            --output-subfolder encoded "$INPUT_DIR"
          test -s "$INPUT_DIR/encoded/sample.flac"
          test -s "$INPUT_DIR/sample.wav"
          ffprobe -v error -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 "$INPUT_DIR/encoded/sample.flac" \
            | grep -qx flac

  cross-platform:
    name: Compile & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Compile and test
        run: cargo test --all --locked
      - name: Release compilation
        run: cargo build --release --locked
