[package]
name = "rusty-crunch"
version = "0.6.1"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false }
console = "0.15"
walkdir = "2.5"
anyhow = "1.0"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
notify = "6"
ctrlc = "3"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync"] }
futures = "0.3.32"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[[bin]]
name = "rusty-crunch"
path = "src/main.rs"
